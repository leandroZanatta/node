# JUL — console + arquivo rotativo.
#
# Lido por br.com.node.util.Diario (programaticamente, como primeira coisa no
# Main), e NÃO pela propriedade java.util.logging.config.file — assim vale igual
# na JVM e no binário GraalVM, sem depender de -D na linha de comando.
#
# Sobrescritas sem editar este arquivo:
#   -Dnode.log.dir=caminho   (padrão: logs, relativo ao diretório de execução)
#   -Dnode.log.nivel=FINE    (padrão: INFO; vale para console e arquivo)

handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

.level=INFO

java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.pattern=logs/node-%g.log
java.util.logging.FileHandler.limit=10485760
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

br.com.node.level=INFO
